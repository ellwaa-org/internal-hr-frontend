# Optional VPS overlay (not needed for Coolify):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.docker up -d --build

services:
  web:
    image: internal-hr:${IMAGE_TAG:-latest}
    environment:
      PORT: ${PORT:-3000}
      API_PROXY_TARGET: ${VITE_API_PROXY_TARGET}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
