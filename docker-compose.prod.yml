# Production overlay — use with the base compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.docker up -d --build
#
# Required in .env.docker (or the environment):
#   API_PROXY_TARGET=https://your-production-api.example.com
#   IMAGE_TAG=1.0.0   (optional but recommended)

services:
  web:
    image: internal-hr:${IMAGE_TAG:?Set IMAGE_TAG for production deploys}
    environment:
      # Fail loudly if missing — do not fall back to staging in production
      API_PROXY_TARGET: ${API_PROXY_TARGET:?Set API_PROXY_TARGET to the production API origin}
    ports:
      - "${APP_PORT:-80}:80"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
