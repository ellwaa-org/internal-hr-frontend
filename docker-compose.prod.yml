# Optional production overlay (VPS / plain Docker — not required for Coolify)
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.docker up -d --build

services:
  web:
    image: internal-hr:${IMAGE_TAG:-latest}
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-https://hr-api-staging.ellwaa.com}
    ports:
      - "${APP_PORT:-80}:80"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
