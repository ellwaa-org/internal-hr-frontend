# Local:
#   docker compose up --build
#   http://localhost:3000
#
# Coolify uses Dockerfile (Port Exposes = 3000).

name: internal-hr

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: internal-hr:${IMAGE_TAG:-local}
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      API_PROXY_TARGET: ${VITE_API_PROXY_TARGET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
