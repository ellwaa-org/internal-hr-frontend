# Internal HR frontend — clear local/staging run
#
# Usage:
#   docker compose up --build
#   open http://localhost:8080
#
# Override API backend:
#   API_PROXY_TARGET=https://hr-api.example.com docker compose up --build
#
# Or copy .env.docker.example → .env.docker and edit values.

name: internal-hr

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time (keep /api for same-origin)
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: internal-hr:local
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - path: .env.docker
        required: false
    environment:
      # Runtime nginx proxy target (scheme + host, no trailing slash)
      API_PROXY_TARGET: ${API_PROXY_TARGET:-https://hr-api-staging.ellwaa.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
