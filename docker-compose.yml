# Internal HR frontend — local / staging defaults
#
# Usage:
#   docker compose up --build
#   open http://localhost:8080
#
# Deploy:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.docker up -d --build

name: internal-hr

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time (keep /api for same-origin)
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: internal-hr:${IMAGE_TAG:-local}
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - path: .env.docker
        required: false
    environment:
      # Runtime nginx proxy target (scheme + host, no trailing slash)
      API_PROXY_TARGET: ${API_PROXY_TARGET:-https://hr-api-staging.ellwaa.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
