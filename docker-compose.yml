# Local / staging
#   docker compose up --build
#   http://localhost:8080
#
# Coolify uses the Dockerfile directly (this file is optional for local only).

name: internal-hr

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: internal-hr:${IMAGE_TAG:-local}
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-https://hr-api-staging.ellwaa.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
